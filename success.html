<!DOCTYPE html>
<html lang="ru">
<head>
<link rel="icon" type="image/png" href="favicon.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Успешная оплата — Velora VPN</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        /* =========================
           VELORA VPN — SUCCESS PAGE
           ========================= */
        :root {
            --bg: #09090b;
            --text: #ffffff;
            --muted: #a1a1aa;
            --border: rgba(255, 255, 255, 0.08);
            --glow-blue: rgba(56, 189, 248, 0.8);
            --glow-purple: rgba(139, 92, 246, 0.8);
        }

        body {
            margin: 0;
            font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, sans-serif;
            color: var(--text);
            background: var(--bg);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
            padding: 20px;
            box-sizing: border-box;
        }

        /* ФОНОВЫЕ СВЕЧЕНИЯ */
        .ambient-glow {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            z-index: 0;
            pointer-events: none;
        }
        .glow-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.15;
        }
        .orb-1 { top: -20%; left: -10%; width: 60vw; height: 60vw; background: #38bdf8; }
        .orb-2 { bottom: -20%; right: -10%; width: 70vw; height: 70vw; background: #8b5cf6; }

        /* КАРТОЧКА СТЕКЛО */
        .velora-glass-card {
            background: rgba(24, 24, 27, 0.5);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-radius: 24px;
            padding: 45px 40px;
            width: 100%;
            max-width: 520px;
            text-align: center;
            position: relative;
            z-index: 1;
            box-shadow: 0 30px 60px rgba(0,0,0,0.6), 0 0 40px rgba(139, 92, 246, 0.1);
        }

        /* Постоянная переливающаяся рамка для страницы успеха */
        .velora-glass-card::after {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: inherit;
            padding: 2px;
            background: linear-gradient(135deg, var(--glow-blue), var(--glow-purple), rgba(255,255,255,0.1));
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            opacity: 1; /* Всегда включено */
            pointer-events: none;
            z-index: -1;
        }

        .velora-logo {
            font-size: 20px;
            font-weight: 800;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 25px;
            opacity: 0.8;
        }

        h1 {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -1px;
            margin: 0 0 10px 0;
        }

        .status {
            font-size: 15px;
            font-weight: 500;
            color: var(--muted);
            margin-bottom: 30px;
        }

        /* БЛОК С КЛЮЧАМИ */
        .credentials {
            display: none;
            text-align: left;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 10px 24px;
            animation: fadeIn 0.6s ease-out forwards;
            margin-bottom: 30px;
        }

        .row {
            display: flex;
            flex-direction: column;
            padding: 16px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .row:last-child {
            border-bottom: none;
        }

        .label {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1.5px;
            color: var(--muted);
            text-transform: uppercase;
            margin-bottom: 6px;
        }

        .value {
            font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
            font-size: 14px;
            color: #ffffff;
            word-break: break-all;
            line-height: 1.5;
            user-select: all; /* Позволяет копировать по одному клику */
        }

        .error {
            color: #ef4444; /* Красный для ошибок */
            font-weight: 600;
        }
        
        .success-text {
            color: #38bdf8; /* Голубой для успешного статуса */
            font-weight: 600;
        }

        /* КНОПКА ВОЗВРАТА */
        .btn-outline {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 14px 28px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.05);
            color: #ffffff;
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-decoration: none;
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: 0.3s ease;
            width: 100%;
        }

        .btn-outline:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: #ffffff;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 600px) {
            .velora-glass-card { padding: 35px 25px; }
            h1 { font-size: 24px; }
        }
    </style>
</head>
<body>

<!-- ФОНОВЫЕ СВЕЧЕНИЯ -->
<div class="ambient-glow">
    <div class="glow-orb orb-1"></div>
    <div class="glow-orb orb-2"></div>
</div>

<div class="velora-glass-card">
    <div class="velora-logo">VELORA</div>
    
    <h1>Оплата получена</h1>
    <div id="status" class="status">
        Проверяем транзакцию и создаём ключи...
    </div>

    <div id="credentials" class="credentials">
        <div class="row">
            <div class="label">Логин</div>
            <div id="username" class="value"></div>
        </div>
        <div class="row">
            <div class="label">Пароль</div>
            <div id="password" class="value"></div>
        </div>
        <div class="row">
            <div class="label">WireGuard IP</div>
            <div id="wg_ip" class="value"></div>
        </div>
        <div class="row">
            <div class="label">WireGuard Private Key</div>
            <div id="wg_private_key" class="value"></div>
        </div>
        <div class="row">
            <div class="label">WireGuard Public Key</div>
            <div id="wg_public_key" class="value"></div>
        </div>
        <div class="row">
            <div class="label">Действует до</div>
            <div id="expired_at" class="value"></div>
        </div>
    </div>
    
    <a href="index.html" class="btn-outline">Вернуться на главную</a>
</div>

<script>
const WORKER_URL = "https://velora-api.b9skkytkgr.workers.dev/";

const statusElement = document.getElementById("status");
const credentialsElement = document.getElementById("credentials");
const params = new URLSearchParams(window.location.search);

const invoiceId =
  params.get("invoiceId") ||
  params.get("invoice_id") ||
  params.get("orderId") ||
  params.get("order_id") ||
  params.get("pay_id");

if (!invoiceId) {
  statusElement.innerHTML = '<span class="error">Не найден ID заказа в ссылке.</span>';
} else {
  checkPayment();
}

async function checkPayment() {
  try {
    const response = await fetch(
      `${WORKER_URL}/get_key?invoiceId=${encodeURIComponent(invoiceId)}`
    );
    const data = await response.json();
    console.log("Velora payment status:", data);

    if (data.status === "ready") {
      statusElement.innerHTML = '<span class="success-text">VPN-доступ успешно создан.</span>';
      document.getElementById("username").textContent = data.username || "—";
      document.getElementById("password").textContent = data.password || "—";
      document.getElementById("wg_ip").textContent = data.wg_ip || "—";
      document.getElementById("wg_private_key").textContent = data.wg_private_key || "—";
      document.getElementById("wg_public_key").textContent = data.wg_public_key || "—";
      
      // Форматируем дату, если она есть
      let dateText = "—";
      if (data.expired_at) {
          const d = new Date(data.expired_at);
          if (!isNaN(d)) {
              dateText = d.toLocaleDateString("ru-RU", { day: '2-digit', month: '2-digit', year: 'numeric' });
          } else {
              dateText = data.expired_at;
          }
      }
      document.getElementById("expired_at").textContent = dateText;
      
      credentialsElement.style.display = "block";
      return;
    }

    if (data.status === "pending" || data.status === "processing") {
      statusElement.textContent = "Оплата найдена. Ожидаем подтверждение от банка...";
      setTimeout(checkPayment, 3000);
      return;
    }

    if (data.status === "error") {
      statusElement.innerHTML =
        '<span class="error">' +
        (data.error || "Не удалось создать VPN-доступ.") +
        "</span>";
      return;
    }

    statusElement.textContent = "Ожидаем подтверждение оплаты...";
    setTimeout(checkPayment, 3000);

  } catch (error) {
    console.error(error);
    statusElement.innerHTML =
      '<span class="error">' +
      "Не удалось связаться с сервером. Попробуйте обновить страницу." +
      "</span>";
  }
}
</script>

</body>
</html>
